name: jarvis_smart_clock

description: JARVIS Smart Clock companion app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.3.12
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.1
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/jarvis_device.png
